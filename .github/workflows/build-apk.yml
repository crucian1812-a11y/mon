name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты
        run: ./gradlew testDebugUnitTest

      - name: Сборка
        run: ./gradlew assembleRelease

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk FamilyBudget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-apk
          path: FamilyBudget.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Семейный бюджет 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Скачайте **FamilyBudget.apk** на оба телефона и установите (разрешите установку из этого источника).
            Новая версия ставится поверх старой, данные сохраняются.
          files: FamilyBudget.apk
